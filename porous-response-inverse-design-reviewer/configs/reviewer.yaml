project_root: ..
seed: 42
model_name: GeoLoop-PoreGen
release_version: 2.0.0-reviewer-release

data:
  global_csv: data/full/global.csv
  pore_dir: data/full/pore_cloud
  curve_dir: data/full/stress_strain_responses
  curve_kind: stress_strain
  curve_columns: [Strain, Stress]
  curve_points: 50
  max_pores: 1200
  cube_size_mm: 14.0
  train_fraction: 0.8
  val_fraction: 0.1
  split_file: checkpoints/geoloop_gp_v1/split_names.json

normalization:
  response_transform: asinh
  response_scale_quantile: 0.75

model:
  architecture: slot_query_v2
  curve_hidden: 160
  set_hidden: 192
  latent_dim: 128
  decoder_hidden: 512
  slot_dim: 192
  slot_attention_layers: 0
  slot_attention_heads: 4
  dropout: 0.05
  macro_dim: 5
  pore_feature_dim: 10

training:
  batch_size: 3
  epochs: 100
  learning_rate: 3.0e-6
  min_learning_rate: 3.0e-7
  lr_patience: 10
  weight_decay: 1.0e-4
  kl_warmup_epochs: 1
  kl_free_bits: 0.02
  set_loss_points: 320
  early_stopping_patience: 25
  checkpoint_start_epoch: 5
  checkpoint_metric: monitor_total
  scheduler_metric: monitor_total
  response_base_score_weight: 0.50
  response_predictnet_start_epoch: 1
  response_predictnet_warmup_epochs: 1
  response_predictnet_points: 1024
  response_predictnet_selection: generation_topk_porosity
  response_predictnet_presence_power: 0.0
  marginal_feature_weights: [0.25, 0.25, 0.25, 0.6, 0.6, 0.6, 1.0, 1.0, 1.0, 1.0]
  loss_weights:
    pore: 1.0
    presence: 0.35
    macro: 0.25
    porosity_consistency: 1.25
    spatial_moments: 0.75
    marginal_distribution: 0.20
    response_predictnet: 0.75
    kl: 0.01

generation:
  checkpoint: checkpoints/geoloop_gp_v1/best_model.pt
  normalizer: checkpoints/geoloop_gp_v1/normalizer.json
  candidates_per_target: 64
  presence_selection: topk_porosity
  presence_threshold: 0.5
  presence_count_scale: 1.0
  temperature: 0.8
  output_dir: outputs/candidates

screening:
  target_porosity_tolerance: 0.04
  target_pore_count_relative_tolerance: 0.25
  min_pores: 40
  max_pores: 1200
  boundary_policy: allow_truncated
  max_boundary_violation_fraction: 1.0
  max_overlap_pair_fraction: 0.05
  min_coverage_fraction: 0.35
  require_response_prediction: true
  max_curve_nrmse: 0.08
  max_densification_nrmse: 0.12
  max_terminal_relative_error: 0.25
  porenet_checkpoint: external_predictor/dataset_retrain_stress_strain/ckpt_phase_terminal_v1/best_model.pth
  porenet_scalers: external_predictor/dataset_retrain_stress_strain/scalers.bin
  porenet_label_mode: global_log1p_standard

response_validator:
  name: GeoLoop-StressNet
  checkpoint: outputs/stress_validator/best_model.pt
  normalizer: outputs/stress_validator/normalizer.json
  batch_size: 8
  epochs: 200
  learning_rate: 2.0e-4
  hidden: 256

reconstruction:
  output_columns: [X, Y, Z, Area, Volume, Phi, Theta]
  coordinate_unit: mm
  angle_unit: rad

